name: بناء APK محلي لوصلاتي

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-apk:
    name: إنشاء ملف Android APK
    runs-on: ubuntu-latest
    steps:
      - name: جلب الشفرة
        uses: actions/checkout@v4

      - name: إعداد pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: إعداد Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: إعداد Java وAndroid
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: تثبيت الاعتمادات
        run: pnpm install --frozen-lockfile

      - name: بناء الواجهة ونسخها داخل تطبيق Android
        run: pnpm cap:sync

      - name: إنشاء APK تجريبي محلي
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: إتاحة ملف APK للتنزيل
        uses: actions/upload-artifact@v4
        with:
          name: waslati-local-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
